<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#07111f">
<title>FinPilot AI — Financial Command OS</title>

<style>
:root{
  --bg:#f5f7fb;
  --surface:#fff;
  --surface2:#f8fafc;
  --line:#e4e8ef;
  --text:#172033;
  --muted:#6b7688;
  --nav:#26344d;
  --accent:#315efb;
  --green:#138a5b;
  --amber:#a46a08;
  --red:#c23d4f;
  --purple:#7655c7;
  --shadow:0 8px 28px rgba(20,31,55,.06)
}

*{box-sizing:border-box}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font:14px Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif
}

button,input,select,textarea{font:inherit}
button{cursor:pointer}

.app{
  display:grid;
  grid-template-columns:240px 1fr;
  min-height:100vh
}

.sidebar{
  position:sticky;
  top:0;
  height:100vh;
  background:#fff;
  border-right:1px solid var(--line);
  padding:20px 12px;
  overflow:auto
}

.brand{
  display:flex;
  gap:10px;
  align-items:center;
  padding:5px 10px 25px
}

.logo{
  width:38px;
  height:38px;
  border-radius:10px;
  background:var(--nav);
  color:#fff;
  display:grid;
  place-items:center;
  font-weight:800
}

.brand b{font-size:16px}
.brand small{
  display:block;
  color:var(--muted);
  font-size:11px;
  margin-top:3px
}

.nav{
  display:grid;
  gap:3px
}

.nav button{
  border:0;
  background:transparent;
  color:#657186;
  text-align:left;
  padding:10px;
  border-radius:9px;
  display:flex;
  gap:10px;
  align-items:center
}

.nav button:hover{
  background:#f4f6f9;
  color:var(--text)
}

.nav button.active{
  background:#eef2ff;
  color:var(--accent);
  font-weight:700
}

.nav .icon{
  width:20px;
  text-align:center
}

.engine{
  margin-top:25px;
  padding:11px;
  background:var(--surface2);
  border:1px solid var(--line);
  border-radius:10px;
  color:var(--muted);
  font-size:11px;
  line-height:1.6
}

.online{color:var(--green);font-weight:800}

.main{min-width:0}

.topbar{
  position:sticky;
  top:0;
  z-index:10;
  background:rgba(255,255,255,.95);
  backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);
  padding:12px 24px;
  display:flex;
  gap:10px
}

.search{
  display:flex;
  flex:1;
  gap:8px
}

input,select,textarea{
  border:1px solid var(--line);
  border-radius:8px;
  padding:10px 11px;
  background:#fff;
  color:var(--text);
  outline:none
}

.search input{width:100%}

input:focus,select:focus,textarea:focus{
  border-color:#9eb0f8;
  box-shadow:0 0 0 3px #315efb12
}

.btn{
  border:1px solid #d8dee8;
  background:#fff;
  color:#344055;
  border-radius:8px;
  padding:9px 12px;
  font-weight:650
}

.btn:hover{background:#f7f8fa}

.btn.primary{
  background:var(--accent);
  color:#fff;
  border-color:var(--accent)
}

.btn.good{
  background:#e9f8f1;
  color:var(--green);
  border-color:#c5ead9
}

.btn.warn{
  background:#fff6df;
  color:var(--amber);
  border-color:#f1ddb0
}

.btn.danger{
  background:#fff0f2;
  color:var(--red);
  border-color:#f0cbd1
}

.content{
  padding:25px;
  max-width:1500px;
  margin:auto
}

.view{display:none}
.view.active{display:block}

.hero{
  display:flex;
  justify-content:space-between;
  gap:20px;
  align-items:flex-end;
  margin-bottom:20px
}

.eyebrow{
  color:#6c778a;
  text-transform:uppercase;
  letter-spacing:.12em;
  font-size:10px;
  font-weight:800
}

h1{
  font-size:28px;
  letter-spacing:-.035em;
  margin:5px 0
}

h2{margin:5px 0}
h3{font-size:13px;margin:0 0 12px}

.muted{color:var(--muted)}
.green{color:var(--green)}
.red{color:var(--red)}
.yellow{color:var(--amber)}
.blue{color:var(--accent)}

.grid{
  display:grid;
  gap:14px
}

.cards{
  grid-template-columns:repeat(4,minmax(0,1fr))
}

.two{
  grid-template-columns:1.35fr 1fr
}

.three{
  grid-template-columns:repeat(3,minmax(0,1fr))
}

.card{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:12px;
  padding:17px;
  box-shadow:var(--shadow)
}

.metric{
  font-size:25px;
  font-weight:750;
  letter-spacing:-.035em;
  margin:5px 0
}

.kpi .label{
  color:#778296;
  text-transform:uppercase;
  letter-spacing:.08em;
  font-size:10px;
  font-weight:800
}

.bar{
  height:7px;
  background:#e9edf3;
  border-radius:20px;
  overflow:hidden
}

.bar i{
  display:block;
  height:100%;
  background:var(--accent);
  border-radius:inherit
}

.row{
  display:flex;
  justify-content:space-between;
  gap:12px;
  align-items:center;
  padding:11px 0;
  border-bottom:1px solid #edf0f4
}

.row:last-child{border-bottom:0}

.pill{
  display:inline-flex;
  padding:4px 8px;
  border-radius:999px;
  font-size:10px;
  font-weight:800;
  background:#f0f3f7;
  color:#5e6a7d
}

.low{
  color:var(--green);
  background:#e9f8f1
}

.med{
  color:var(--amber);
  background:#fff6df
}

.high{
  color:var(--red);
  background:#fff0f2
}

.notice{
  padding:12px;
  border:1px dashed #cfd7e3;
  border-radius:10px;
  background:#fafbfc;
  color:#657186
}

.action{
  display:flex;
  gap:8px;
  flex-wrap:wrap
}

.compliance{
  display:flex;
  gap:12px;
  align-items:center;
  margin-bottom:14px;
  padding:12px 15px;
  background:#291214;
  color:#f8d7da;
  border:1px solid #7f1d1d;
  border-radius:12px
}

.compliance span{
  flex:1;
  color:#d9c8ca
}

.feed{
  max-height:380px;
  overflow:auto
}

.feedItem{
  padding:12px;
  margin-bottom:8px;
  background:var(--surface2);
  border-left:2px solid #cbd4e3;
  border-radius:0 8px 8px 0
}

.feedItem b{display:block;margin-bottom:4px}

.agentGrid{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:14px
}

.agent{
  min-height:150px
}

.agentIcon{
  font-size:22px
}

.tag{
  display:inline-flex;
  padding:5px 8px;
  margin:2px;
  border-radius:999px;
  background:#f0f3ff;
  color:#5269b6;
  font-size:11px
}

.form{
  display:grid;
  gap:10px
}

.formGrid{
  grid-template-columns:repeat(2,minmax(0,1fr))
}

.table{
  width:100%;
  border-collapse:collapse
}

.table th,.table td{
  padding:10px;
  border-bottom:1px solid #edf0f4;
  text-align:left
}

.table th{
  color:#7a8494;
  font-size:10px;
  text-transform:uppercase
}

.decision{
  border:1px solid #d9e1ee;
  background:#fff;
  border-radius:12px;
  padding:17px
}

.decisionScore{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:12px
}

.voiceGrid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px
}

.voice{
  padding:12px;
  border:1px solid var(--line);
  background:var(--surface2);
  border-radius:10px
}

.chart{
  height:180px;
  display:flex;
  align-items:end;
  gap:5px
}

.chartBar{
  flex:1;
  background:#dce5ff;
  border-radius:4px 4px 0 0
}

.modal{
  position:fixed;
  inset:0;
  z-index:50;
  background:rgba(15,23,42,.45);
  display:none;
  place-items:center;
  padding:20px
}

.modal.open{display:grid}

.modalBox{
  width:min(700px,100%);
  max-height:90vh;
  overflow:auto;
  background:#fff;
  border-radius:14px;
  padding:20px
}

.toast{
  position:fixed;
  right:20px;
  bottom:20px;
  background:#172033;
  color:#fff;
  padding:11px 14px;
  border-radius:9px;
  display:none;
  z-index:100
}

.toast.show{display:block}

@media(max-width:1100px){
  .app{grid-template-columns:75px 1fr}
  .brandText,.engine{display:none}
  .nav button{
    justify-content:center
  }
  .nav button span:last-child{display:none}
  .cards{grid-template-columns:repeat(2,1fr)}
  .agentGrid{grid-template-columns:repeat(3,1fr)}
}

@media(max-width:720px){
  .app{display:block}
  .sidebar{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    top:auto;
    height:62px;
    z-index:40;
    padding:5px;
    border-top:1px solid var(--line)
  }

  .brand,.engine{display:none}

  .nav{
    display:flex;
    justify-content:space-around
  }

  .nav button{
    padding:7px;
    font-size:9px;
    display:grid;
    gap:2px
  }

  .nav button span:last-child{display:block}

  .topbar{
    padding:10px 12px
  }

  .topbar>.btn{display:none}

  .content{
    padding:16px 14px 80px
  }

  .hero{
    display:block
  }

  .hero .action{
    margin-top:12px
  }

  .cards,
  .two,
  .three,
  .formGrid,
  .agentGrid{
    grid-template-columns:1fr
  }

  .voiceGrid{
    grid-template-columns:1fr 1fr
  }

  .compliance{
    display:block
  }
}
</style>
</head>

<body>

<div class="app">

<aside class="sidebar">

<div class="brand">
<div class="logo">FP</div>
<div class="brandText">
<b>FinPilot AI</b>
<small>Financial Command OS</small>
</div>
</div>

<nav class="nav" id="nav"></nav>

<div class="engine">
Engine
<strong class="online">● ONLINE</strong>
<br>
Local decision engine ready
</div>

</aside>

<main class="main">

<header class="topbar">

<div class="search">
<input id="globalSearch"
placeholder="Search FinPilot or the web..."
onkeydown="if(event.key==='Enter')webSearch()">
<button class="btn primary" onclick="webSearch()">Search</button>
</div>
