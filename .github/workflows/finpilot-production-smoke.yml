name: FinPilot production smoke

on:
  pull_request:
    paths:
      - ".github/workflows/finpilot-production-smoke.yml"
      - "public/index.html"
      - "public/one-click-analysis.js"
      - "public/deep-learning-os.js"
      - "public/tradingview-paper-bridge.js"
      - "public/paper-engine.js"
      - "public/paper-lab.js"
      - "tests/tradingview-paper-bridge.test.mjs"
      - "tests/tradingview-alert-bridge.test.mjs"
      - "package.json"
      - "TRADINGVIEW-PAPER-BRIDGE.md"
      - "server/**"
  workflow_dispatch:
  schedule:
    - cron: "17,47 * * * *"

permissions:
  contents: read

concurrency:
  group: finpilot-production-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check public homepage and API readiness
        shell: bash
        env:
          BASE_URL: https://finpilot-ai-8wn6.onrender.com
        run: |
          set -euo pipefail

          fetch_200() {
            local url="$1"
            local output="$2"
            local status="000"
            for attempt in 1 2 3; do
              status="$(curl --silent --show-error --max-time 25 --output "$output" --write-out '%{http_code}' "$url" || true)"
              if [[ "$status" == "200" ]]; then
                return 0
              fi
              echo "Attempt $attempt returned HTTP $status for $url"
              sleep 20
            done
            echo "Endpoint failed after retries: $url (HTTP $status)"
            return 1
          }

          fetch_200 "$BASE_URL/" /tmp/finpilot-home.html
          fetch_200 "$BASE_URL/api/health" /tmp/finpilot-health.json
          fetch_200 "$BASE_URL/api/core-status" /tmp/finpilot-core.json
          fetch_200 "$BASE_URL/api/agent-memory" /tmp/finpilot-memory.json
          if [[ "${GITHUB_EVENT_NAME}" != "pull_request" ]]; then
            fetch_200 "$BASE_URL/api/tradingview/status" /tmp/finpilot-tradingview-status.json
            fetch_200 "$BASE_URL/api/tradingview/alerts?limit=2" /tmp/finpilot-tradingview-alerts.json
          fi

          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const home = fs.readFileSync('/tmp/finpilot-home.html', 'utf8');
          const health = JSON.parse(fs.readFileSync('/tmp/finpilot-health.json', 'utf8'));
          const core = JSON.parse(fs.readFileSync('/tmp/finpilot-core.json', 'utf8'));
          const memory = JSON.parse(fs.readFileSync('/tmp/finpilot-memory.json', 'utf8'));
          const isPullRequest = process.env.GITHUB_EVENT_NAME === 'pull_request';
          const tradingView = isPullRequest ? null : JSON.parse(fs.readFileSync('/tmp/finpilot-tradingview-status.json', 'utf8'));
          const tradingViewAlerts = isPullRequest ? null : JSON.parse(fs.readFileSync('/tmp/finpilot-tradingview-alerts.json', 'utf8'));

          const failures = [];
          if (!home.includes('one-click-analysis.js')) failures.push('homepage does not reference one-click analysis');
          if (!home.includes('deep-learning-os.js')) failures.push('homepage does not reference deep-learning OS');
          if (!home.includes('tradingview-paper-bridge.js')) failures.push('homepage does not reference the TradingView paper bridge');
          if (!home.includes('paper-engine.js')) failures.push('homepage does not reference the paper engine');
          if (health.ok !== true || health.status !== 'OPERATIONAL') failures.push('health endpoint is not operational');
          if (health.frontendSyntax?.ok !== true) failures.push('frontend syntax health check failed');
          if (core.ok !== true) failures.push('core status endpoint returned ok=false');
          if (memory.ok !== true || !String(memory.trust || '').includes('unverified telemetry')) failures.push('agent memory endpoint is missing the unverified telemetry trust boundary');
          if (!isPullRequest && (tradingView.ok !== true || typeof tradingView.acceptingWebhooks !== 'boolean' || tradingView.realMoneyTrading !== false)) failures.push('TradingView webhook status is invalid or does not preserve paper-only mode');
          if (!isPullRequest && (tradingViewAlerts.ok !== true || !Array.isArray(tradingViewAlerts.alerts) || tradingViewAlerts.realMoneyTrading !== false)) failures.push('TradingView alert inbox endpoint is invalid or does not preserve paper-only mode');

          console.log(JSON.stringify({
            homepage: 'HTTP 200',
            health: { ok: health.ok, status: health.status, version: health.version, frontendSyntax: health.frontendSyntax },
            core: { ok: core.ok, version: core.version, serverExecutedAgentRuns: core.serverExecutedAgentRuns, clientReportedAgentRuns: core.clientReportedAgentRuns, agentMemoryPersistent: core.agentMemoryPersistent },
            agentMemory: { ok: memory.ok, totalAgents: memory.totalAgents, persistence: memory.persistence, trust: memory.trust },
            tradingView: isPullRequest ? 'production route checks deferred until merge/deploy' : { ok: tradingView.ok, configurationState: tradingView.configurationState, acceptingWebhooks: tradingView.acceptingWebhooks, queueCount: tradingView.queueCount, realMoneyTrading: tradingView.realMoneyTrading, listedAlerts: tradingViewAlerts.alerts.length },
            failures
          }, null, 2));

          if (failures.length) process.exit(1);
          NODE

      - name: Check production agent assets
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          BASE_URL: https://finpilot-ai-8wn6.onrender.com
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 25 "$BASE_URL/one-click-analysis.js?smoke=$(date +%s)" -o /tmp/finpilot-one-click.js
          curl --fail --silent --show-error --max-time 25 "$BASE_URL/deep-learning-os.js?smoke=$(date +%s)" -o /tmp/finpilot-deep-learning.js
          curl --fail --silent --show-error --max-time 25 "$BASE_URL/tradingview-paper-bridge.js?smoke=$(date +%s)" -o /tmp/finpilot-tradingview-bridge.js
          grep -q "syncClientAgentTelemetry" /tmp/finpilot-one-click.js
          grep -q "SPECIALIST_FLEET_INCOMPLETE" /tmp/finpilot-one-click.js
          grep -q "forecastTrainingReport" /tmp/finpilot-deep-learning.js
          grep -q "function analysisSymbol" /tmp/finpilot-tradingview-bridge.js
          grep -q "SIMULATION ONLY" /tmp/finpilot-tradingview-bridge.js
          grep -q "does not send live prices" /tmp/finpilot-tradingview-bridge.js
          grep -q "fpTvAlertInbox" /tmp/finpilot-tradingview-bridge.js
          grep -q "TRADINGVIEW_WEBHOOK_SECRET" /tmp/finpilot-tradingview-bridge.js
          grep -q "Review in Paper Arena" /tmp/finpilot-tradingview-bridge.js
          echo "Production agent assets and TradingView-to-paper bridge served their expected safety contracts."
