name: FinPilot Node CI
# Automated agent-core and paper-arena validation

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20.x"
      - name: Install dependencies
        run: npm install
      - name: Run FinPilot test suite
        run: npm test
      - name: Run syntax checks
        run: npm run check
      - name: Start FinPilot server
        env:
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
          SERPAPI_ENGINE: google_news
          SERPAPI_GL: in
          SERPAPI_HL: en
        run: |
          PORT=8787 HOST=127.0.0.1 npm start > /tmp/finpilot.log 2>&1 &
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:8787/api/health > /tmp/health.json; then break; fi
            sleep 1
          done
          cat /tmp/finpilot.log
          cat /tmp/health.json
      - name: Smoke-test FinPilot API and dashboard
        run: |
          curl -fsS http://127.0.0.1:8787/ | grep -q "FinPilot"
          curl -fsS http://127.0.0.1:8787/api/core-status | grep -q '"ok":true'
          curl -fsS http://127.0.0.1:8787/api/compliance | grep -q '"jurisdiction":"India"'
          curl -fsS "http://127.0.0.1:8787/api/stock-report?ticker=SBC" | grep -q '"ticker":"SBC"'
          echo "FinPilot server smoke test passed"
      - name: Live Internet Search smoke test
        env:
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
          SERPAPI_ENGINE: google_news
          SERPAPI_GL: in
          SERPAPI_HL: en
          SEARCH_PROVIDER: serpapi
        run: |
          if [ -z "$SERPAPI_API_KEY" ]; then
            echo "SERPAPI_API_KEY is not configured in GitHub Actions; live search smoke test skipped."
            exit 0
          fi
          body="$(curl -fsS --get --data-urlencode "q=IRFC" --data-urlencode "count=3" http://127.0.0.1:8787/api/search)"
          echo "$body"
          echo "$body" | grep -q '"live":true'
          echo "$body" | grep -q '"provider":"serpapi"'
          echo "$body" | grep -q '"results":'
          echo "Live Internet Search smoke test passed"
