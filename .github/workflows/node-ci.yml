name: FinPilot Node CI
# Automated agent-core and paper-arena validation
# Final verification trigger

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20.x"
      - name: Install dependencies
        run: npm install
      - name: Run CEO/CFO/Judge tests
        run: node tests/ceo-cfo-judge.test.mjs
      - name: Run autonomous learning authority/freshness tests
        run: node tests/autonomous-learning.test.mjs
      - name: Run paper engine tests
        run: node tests/paper-engine.test.mjs
      - name: Run adaptive research tests
        run: node tests/adaptive-research.test.mjs
      - name: Run dashboard editor tests
        run: node tests/dashboard-edit.test.mjs
      - name: Run agent evolution tests
        run: node tests/agent-evolution.test.mjs
      - name: Validate final release assets
        run: |
          test -f public/index.html
          test -f public/quantum-ai.js
          test -f public/quantum-v5-ui.js
          test -f public/agent-evolution.js
          test -f public/paper-engine.js
          test -f public/adaptive-research.js
          test -f public/decision-core.js
          echo "FinPilot final release assets present"
      - name: Run syntax checks
        run: npm run check
      - name: Start FinPilot server
        env:
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
          SERPAPI_ENGINE: google_news
          SERPAPI_GL: in
          SERPAPI_HL: en
        run: |
          PORT=8787 HOST=127.0.0.1 npm start > /tmp/finpilot.log 2>&1 &
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:8787/api/health > /tmp/health.json; then break; fi
            sleep 1
          done
          cat /tmp/finpilot.log
          cat /tmp/health.json
      - name: Smoke-test FinPilot API and dashboard
        run: |
          curl -fsS http://127.0.0.1:8787/ | grep -q "FinPilot"
          curl -fsS http://127.0.0.1:8787/api/core-status | grep -q '"ok":true'
          curl -fsS http://127.0.0.1:8787/api/compliance | grep -q '"jurisdiction":"India"'
          curl -fsS "http://127.0.0.1:8787/api/stock-report?ticker=SBC" | grep -q '"ticker":"SBC"'
          curl -fsS --get --data-urlencode "ticker=SBC" --data-urlencode "interval=1h" --data-urlencode "multi=0" http://127.0.0.1:8787/api/market-snapshot > /tmp/market-snapshot.json
          node --input-type=module -e "import fs from 'node:fs'; const d=JSON.parse(fs.readFileSync('/tmp/market-snapshot.json','utf8')); if(!d.snapshot?.snapshotId||!d.snapshot?.quality?.status) throw new Error('market snapshot contract missing'); if(d.snapshot.quality.forecastEligible && !d.report?.live) throw new Error('snapshot eligibility disagrees with live quote'); console.log('Market snapshot API smoke test passed:',d.snapshot.quality.status)"
          curl -fsS -D /tmp/local-page-headers -o /dev/null http://127.0.0.1:8787/
          grep -qi 'Content-Security-Policy:.*script-src.*s3.tradingview.com' /tmp/local-page-headers
          grep -qi 'Content-Security-Policy:.*frame-src.*www.tradingview.com' /tmp/local-page-headers
          echo "FinPilot server, market snapshot, and chart policy smoke tests passed"
      - name: Production health and search smoke test
        run: |
          set -e
          # Render free instances can be cold-starting or rolling over during this check.
          # Retry transient gateway timeouts, but still fail if health/search never recover.
          curl --retry 4 --retry-delay 4 --retry-all-errors --connect-timeout 5 --max-time 18 -fsS https://finpilot-ai-8wn6.onrender.com/api/health | tee /tmp/prod-health.json
          grep -q '"ok":true' /tmp/prod-health.json
          curl --retry 4 --retry-delay 4 --retry-all-errors --connect-timeout 5 --max-time 18 -fsS --get --data-urlencode "q=IRFC" --data-urlencode "count=3" https://finpilot-ai-8wn6.onrender.com/api/search | tee /tmp/prod-search.json
          grep -q '"live":true' /tmp/prod-search.json
          grep -q '"results":' /tmp/prod-search.json
          curl --retry 4 --retry-delay 4 --retry-all-errors --connect-timeout 5 --max-time 18 -fsS --get --data-urlencode "ticker=SBC" --data-urlencode "interval=1h" --data-urlencode "multi=0" https://finpilot-ai-8wn6.onrender.com/api/market-snapshot > /tmp/prod-market-snapshot.json
          node --input-type=module -e "import fs from 'node:fs'; const d=JSON.parse(fs.readFileSync('/tmp/prod-market-snapshot.json','utf8')); if(!d.snapshot?.snapshotId||!d.snapshot?.quality?.status) throw new Error('production market snapshot contract missing'); if(d.snapshot.quality.forecastEligible && !d.report?.live) throw new Error('production snapshot allowed a non-live quote'); console.log('Production market snapshot passed:',d.snapshot.quality.status)"
          curl --retry 4 --retry-delay 4 --retry-all-errors --connect-timeout 5 --max-time 18 -fsS -D /tmp/prod-page-headers -o /dev/null https://finpilot-ai-8wn6.onrender.com/
          grep -qi 'Content-Security-Policy:.*script-src.*s3.tradingview.com' /tmp/prod-page-headers
          grep -qi 'Content-Security-Policy:.*frame-src.*www.tradingview.com' /tmp/prod-page-headers
          echo "Production health, search, market snapshot, and chart policy smoke tests passed"
      - name: Live Internet Search smoke test
        env:
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
          SERPAPI_ENGINE: google_news
          SERPAPI_GL: in
          SERPAPI_HL: en
          SEARCH_PROVIDER: serpapi
        run: |
          if [ -z "$SERPAPI_API_KEY" ]; then
            echo "SERPAPI_API_KEY is not configured in GitHub Actions; live search smoke test skipped."
            exit 0
          fi
          body="$(curl -fsS --get --data-urlencode "q=IRFC" --data-urlencode "count=3" http://127.0.0.1:8787/api/search)"
          echo "$body"
          echo "$body" | grep -q '"live":true'
          echo "$body" | grep -q '"provider":"serpapi"'
          echo "$body" | grep -q '"results":'
          echo "Live Internet Search smoke test passed"
