name: FinPilot Foundation CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm install
      - name: Syntax and frontend checks
        run: npm run check
      - name: Foundation and regression tests
        run: npm test
